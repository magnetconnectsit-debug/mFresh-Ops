name: mfresh_ops
description: "Magnet Connects Operations App (mfresh_ops)."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Internal Shared Packages
  core:
    path: ../../shared/core
  services:
    path: ../../shared/services
  models:
    path: ../../shared/models
  dev:
    path: ../../shared/dev

  # External Dependencies
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  image_picker: ^1.1.2
  csv: ^6.0.0
  path_provider: ^2.1.3
  open_filex: ^4.5.0
  dio: ^5.9.2

dependency_overrides:
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
