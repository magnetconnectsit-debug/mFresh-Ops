name: mfresh_ops
description: "Magnet Connects Operations App (mfresh_ops)."
version: 1.0.39+49
publish_to: 'none'

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Internal Shared Packages
  core:
    path: ../../shared/core
  services:
    path: ../../shared/services
  dev:
    path: ../../shared/dev

  # External Dependencies
  get: ^4.7.3
  device_info_plus: ^11.5.0
  android_id: ^0.4.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^20.1.0
  package_info_plus: ^9.0.1
  flutter_screenutil: ^5.9.3
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  video_compress: ^3.1.2
  csv: ^6.0.0
  path_provider: ^2.1.3
  open_filex: ^4.5.0
  dio: ^5.9.2
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.1.3
  intl: ^0.20.2
  flutter_animate: ^4.5.0
  envied: ^1.3.4
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.1
  skeletonizer: ^2.1.3
  fl_chart: ^1.2.0
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.10.0
  flutter_foreground_task: ^6.5.0
  geolocator: ^14.0.2
  json_annotation: ^4.9.0
  connectivity_plus: ^7.1.1
  battery_plus: ^6.2.2
  geocoding: ^3.0.0
  pinput: ^5.0.0
  auto_start_flutter: ^1.1.0
  qr_flutter: ^4.1.0
  printing: ^5.14.3
  pdf: ^3.12.0
  flutter_thermal_printer: ^2.0.1
  esc_pos_utils_plus: ^2.0.4
  image: ^4.5.2
  mobile_scanner: ^6.0.4
  reorderable_grid_view: ^2.2.8
  cached_network_image: ^3.3.1
  share_plus: ^10.1.0
dependency_overrides:
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  envied_generator: ^1.3.4
  build_runner: ^2.4.15
  json_serializable: ^6.9.0
  hive_ce_generator: ^1.11.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
