name: core
description: "Core UI components, constants, and utilities for Magnet Connects."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  get: ^4.7.3
  flutter_svg: ^2.2.4
  lottie: ^3.3.3
  google_fonts: ^8.0.2
  url_launcher: ^6.3.2
