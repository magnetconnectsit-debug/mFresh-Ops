name: services
description: "Backend services and logic for Magnet Connects."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Internal Dependencies
  core:
    path: ../core

  # External Dependencies
  get: ^4.7.3
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  firebase_remote_config: ^6.4.0
  flutter_local_notifications: ^20.1.0
  connectivity_plus: ^7.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  in_app_update: ^4.2.5
  envied: ^1.3.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  envied_generator: ^1.3.4
  build_runner: ^2.4.15
